# Checks every push and pull request, then deploys to Cloudflare Pages:
#   main            -> production   (https://<project>.pages.dev)
#   any other branch -> preview      (https://<branch>.<project>.pages.dev)
# Deployment is skipped (not failed) until the Cloudflare secrets exist.
name: CI and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT: gabriel-olius
  # Public URL used for canonical links. Change when a custom domain is connected.
  SITE_URL: https://gabriel-olius.pages.dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Type and content check
        run: npx astro check
      - name: Build
        run: npm run build
      - name: Check internal links
        run: npm run check:links

      - name: Check for secrets in the build output
        run: |
          if grep -rIlE '(api[_-]?key|secret|password|token)\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,}' dist; then
            echo "::error::Possible secret found in build output"; exit 1
          fi

      # Same-repository pushes only: forks never receive secrets.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured; skipping deployment."
            exit 0
          fi
          npx --yes wrangler@4.147.0 pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT" \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "$(git log -1 --pretty=%s | head -c 300)" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "### Deployed: ${url}" >> "$GITHUB_STEP_SUMMARY"
